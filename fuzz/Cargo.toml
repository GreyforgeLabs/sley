[package]
name = "sley-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "scb1_decoder"
path = "targets/scb1_decoder.rs"

[[bin]]
name = "schema_bootstrap_decoder"
path = "targets/schema_bootstrap_decoder.rs"

[[bin]]
name = "repository_pack_importer"
path = "targets/repository_pack_importer.rs"

[[bin]]
name = "type_checker"
path = "targets/type_checker.rs"

[[bin]]
name = "ssmc_graph_cfg_checker"
path = "targets/ssmc_graph_cfg_checker.rs"

[[bin]]
name = "restricted_query_request"
path = "targets/restricted_query_request.rs"

[[bin]]
name = "vm_canonical_inputs"
path = "targets/vm_canonical_inputs.rs"

[[bin]]
name = "adapter_responses"
path = "targets/adapter_responses.rs"

[[bin]]
name = "mutation_candidate"
path = "targets/mutation_candidate.rs"

[[bin]]
name = "candidate_result"
path = "targets/candidate_result.rs"

[[bin]]
name = "transaction_receipt"
path = "targets/transaction_receipt.rs"

[dependencies]
sley-adapter = { path = "../crates/sley-adapter" }
sley-check = { path = "../crates/sley-check" }
sley-id = { path = "../crates/sley-id" }
sley-mutate = { path = "../crates/sley-mutate" }
sley-policy = { path = "../crates/sley-policy" }
sley-query = { path = "../crates/sley-query" }
sley-repo = { path = "../crates/sley-repo" }
sley-scb1 = { path = "../crates/sley-scb1" }
sley-schema = { path = "../crates/sley-schema" }
sley-ssmc = { path = "../crates/sley-ssmc" }
sley-store = { path = "../crates/sley-store" }
sley-txn = { path = "../crates/sley-txn" }
sley-vm = { path = "../crates/sley-vm" }
