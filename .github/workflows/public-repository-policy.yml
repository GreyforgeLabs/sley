name: Public repository policy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    env:
      SLEY2_ACTUAL_VISIBILITY: ${{ github.event.repository.visibility }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 scripts/check_public_repository_policy.py
