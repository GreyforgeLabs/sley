[workspace]
resolver = "3"
members = [
    "crates/sley-id",
    "crates/sley-scb1",
    "crates/sley-schema",
    "crates/sley-state-root",
    "crates/sley-store",
]

[workspace.package]
version = "2.0.0-alpha.0"
edition = "2024"
rust-version = "1.93"
license = "LicenseRef-Proprietary"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
